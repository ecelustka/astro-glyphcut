name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm changeset version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    needs: version
    # Publish only on the merge of the version PR. Its commit message starts with the
    # commit-message input above (a squash merge adds " (#N)").
    if: >-
      needs.version.outputs.has-changesets == 'false' &&
      startsWith(github.event.head_commit.message, 'chore: version packages')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2.1.2
        with:
          publish-script: pnpm release
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: true
